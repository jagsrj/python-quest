<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Quest</title>
<meta name="description" content="A fun, step-by-step Python course for kids in grades 7 to 10. Code runs right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=JetBrains+Mono:wght@400&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a trail map of worlds; each mission opens as one readable column with runnable code cells. */
  --bg: #eaf4ef;
  --card: #ffffff;
  --ink: #15323a;
  --muted: #557178;
  --leaf: #23935a;
  --leaf-deep: #16683f;
  --sun: #ffc93c;
  --sky: #2f6fdc;
  --coral: #ef5b4c;
  --line: #cfe2d8;
  --code-bg: #10262c;
  --code-ink: #e7f3ee;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.6 var(--font-body);
  min-height: 100%;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
code { font-family: var(--font-code); font-size: 0.88em; background: #dcefe5; color: var(--leaf-deep); padding: 1px 6px; border-radius: 6px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px max(16px, calc((100% - 1100px) / 2));
  background: var(--leaf-deep); color: #fff;
}
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
.brand b { font-family: var(--font-display); font-size: 24px; letter-spacing: 0.2px; }
.brand svg { width: 40px; height: 40px; }
.stats { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums; }
.xpbar { width: 120px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; transition: width .6s; }
.level { font-size: 13px; opacity: .9; font-weight: 700; }
.flame { color: var(--sun); }
.who { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.14); border: 0; color: #fff; padding: 4px 12px 4px 4px; border-radius: 99px; font-weight: 800; }
.who .av { width: 32px; height: 32px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; font-size: 18px; }
.engine { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.14); }
.engine.ready { background: rgba(255, 201, 60, .25); }

main { padding: 24px max(16px, calc((100% - 1100px) / 2)) 80px; }

/* ---------- map ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; margin-bottom: 28px; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); }
.hero p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.hero .pip-big { width: 130px; }
.continue { margin-top: 14px; }
.world { background: var(--card); border-radius: 22px; padding: 22px; margin-bottom: 22px; border: 2px solid var(--line); }
.world header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.world .tag { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--leaf); }
.world h2 { font-size: 28px; }
.world .count { margin-left: auto; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.world > p { margin: 0 0 16px; color: var(--muted); }
.trail { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.tile {
  position: relative; text-align: left; border: 2px solid var(--line); background: #f6fbf8;
  border-radius: var(--radius); padding: 14px 14px 12px; display: grid; gap: 4px; color: var(--ink);
  transition: transform .12s, border-color .12s;
}
.tile:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--leaf); }
.tile .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; background: var(--leaf); color: #fff; }
.tile .t { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.2; }
.tile .s { font-size: 13px; color: var(--muted); font-weight: 700; }
.tile .stars { font-size: 18px; letter-spacing: 2px; color: #c9d9d1; }
.tile .stars .on { color: #f2a900; }
.tile.done { background: #fff8de; border-color: #f3d77a; }
.tile.done .num { background: var(--sun); color: var(--ink); }
.tile.next { border-color: var(--leaf); box-shadow: 0 0 0 4px rgba(35, 147, 90, .15); }
.tile.boss .num { background: var(--coral); }
.tile:disabled { cursor: not-allowed; opacity: .55; }
.tile:disabled .num { background: #9fb3ab; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { background: var(--card); border: 2px dashed var(--line); border-radius: var(--radius); padding: 12px; text-align: center; color: var(--muted); }
.badge .ico { font-size: 30px; filter: grayscale(1); opacity: .45; }
.badge b { display: block; color: var(--ink); font-size: 15px; }
.badge small { font-size: 12.5px; }
.badge.got { border-style: solid; border-color: #f3d77a; background: #fff8de; }
.badge.got .ico { filter: none; opacity: 1; }
.section-title { font-size: 24px; margin: 30px 0 12px; }

/* ---------- lesson ---------- */
.lesson { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; }
.crumbs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 700; color: var(--muted); }
.crumbs a { color: var(--leaf-deep); }
.lesson h1 { font-size: clamp(30px, 5vw, 42px); }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.step { font-size: 13px; font-weight: 800; padding: 4px 12px; border-radius: 99px; background: #dbe9e2; color: var(--muted); }
.step.on { background: var(--leaf); color: #fff; }
.story { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: start; background: var(--card); border-radius: var(--radius); padding: 16px; border: 2px solid var(--line); }
.story p { margin: 0; }
.story svg { width: 64px; height: 64px; }
.modal svg { width: 72px; height: 72px; }
.grow { flex: 1; }
.card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; border: 2px solid var(--line); }
.card h2 { font-size: 23px; margin-bottom: 6px; }
.card h3 { font-size: 20px; margin-bottom: 4px; }
.card p, .card ul, .card ol { margin: 6px 0; max-width: 68ch; }
.learn-n { font-family: var(--font-display); color: var(--leaf); font-weight: 700; font-size: 14px; }
.mission { border-color: var(--leaf); }
.mission.bonus { border-color: var(--sky); }
.mission .kicker { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--leaf); }
.mission.bonus .kicker { color: var(--sky); }
pre.want { background: #f1f7f3; border-left: 4px solid var(--leaf); padding: 8px 12px; border-radius: 8px; font: 14.5px/1.5 var(--font-code); white-space: pre-wrap; margin: 8px 0; }

/* quiz */
.quiz-code { background: var(--code-bg); color: var(--code-ink); font: 14.5px/1.5 var(--font-code); padding: 10px 14px; border-radius: 10px; white-space: pre; overflow-x: auto; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
.opt { border: 2px solid var(--line); background: #f6fbf8; border-radius: 12px; padding: 10px 12px; font-family: var(--font-code); font-size: 15px; text-align: left; color: var(--ink); }
.opt:hover:not(:disabled) { border-color: var(--leaf); }
.opt.right { background: #def5e7; border-color: var(--leaf); }
.opt.wrong { background: #fde6e3; border-color: var(--coral); }
.feedback { margin-top: 10px; font-weight: 700; }
.feedback.good { color: var(--leaf-deep); }
.feedback.bad { color: #b8372b; }

/* runner */
.runner { margin-top: 10px; border-radius: 12px; overflow: hidden; border: 2px solid #0b1c20; background: var(--code-bg); }
.editor { position: relative; font: 15px/1.6 var(--font-code); tab-size: 4; }
.editor pre, .editor textarea {
  margin: 0; padding: 12px 14px 12px 48px; border: 0; font: inherit; white-space: pre; overflow: auto;
  letter-spacing: normal; word-spacing: normal; tab-size: 4;
}
.editor pre { position: absolute; inset: 0; color: var(--code-ink); pointer-events: none; overflow: hidden; }
.editor textarea {
  position: relative; display: block; width: 100%; resize: none; background: transparent;
  color: transparent; caret-color: #fff; outline: none; min-height: 3.6em;
}
.editor textarea::selection { background: rgba(255, 201, 60, .35); color: transparent; }
.editor .gutter { position: absolute; left: 0; top: 0; bottom: 0; width: 38px; padding: 12px 0; text-align: right; color: #4f7178; font: inherit; pointer-events: none; overflow: hidden; background: #0c1f24; }
.editor .gutter span { display: block; padding-right: 8px; }
.tk-k { color: #ff9e64; }
.tk-b { color: #7dcfff; }
.tk-s { color: #b5e48c; }
.tk-n { color: #ffd166; }
.tk-c { color: #6f8f95; }
.tk-t { color: #f7768e; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 10px; background: #0c1f24; border-top: 1px solid #1d3a41; }
.btn { border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 800; background: #24434a; color: #e6f3ee; }
.btn:hover { filter: brightness(1.1); }
.btn.run { background: var(--sun); color: var(--ink); }
.btn.check { background: var(--leaf); color: #fff; }
.btn.ghost { background: transparent; color: #a9c6c0; border: 1px solid #2e4f56; }
.btn.light { background: #dbe9e2; color: var(--ink); }
.btn.primary { background: var(--leaf); color: #fff; }
.btn:disabled { opacity: .5; cursor: wait; }
.bar .grow { flex: 1; }
.console { padding: 12px 14px; color: var(--code-ink); font: 14.5px/1.55 var(--font-code); white-space: pre-wrap; word-break: break-word; border-top: 1px solid #1d3a41; min-height: 46px; max-height: 340px; overflow: auto; }
.console:empty::before { content: "Output appears here when you press Run."; color: #5d7f86; }
.console .muted { color: #7a9aa0; }
.ask { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
.ask input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 8px; border: 2px solid var(--sun); background: #0b1c20; color: #fff; }
.bug { margin-top: 8px; background: #3b1e22; border: 1px solid #7a3a40; border-radius: 10px; padding: 10px 12px; font-family: var(--font-body); white-space: normal; }
.bug b { color: #ffb4a8; }
.bug .raw { display: block; margin-top: 6px; font: 13px var(--font-code); color: #d6a7a2; }
.canvas-wrap { background: #fffdf6; border-top: 1px solid #1d3a41; display: grid; place-items: center; padding: 8px; }
.canvas-wrap canvas { width: min(100%, 420px); aspect-ratio: 1; border-radius: 10px; }
.verdict { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.verdict.good { background: #def5e7; color: var(--leaf-deep); }
.verdict.bad { background: #fde6e3; color: #8f2a20; }
.hint { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: #fff4cf; }
.solution { margin-top: 10px; }
.next-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.done-flag { color: var(--leaf-deep); font-weight: 800; }
.locked-note { color: var(--muted); font-weight: 700; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(13, 35, 40, .55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--card); border-radius: 22px; padding: 24px; width: min(520px, 100%); max-height: 92vh; overflow: auto; display: grid; gap: 14px; }
.modal h2 { font-size: 28px; }
.modal label { font-weight: 800; display: block; margin-bottom: 4px; }
.modal input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); }
.avatars { display: flex; gap: 8px; flex-wrap: wrap; }
.avatars button { width: 52px; height: 52px; border-radius: 50%; border: 3px solid transparent; background: #eef6f1; font-size: 26px; }
.avatars button[aria-pressed=true] { border-color: var(--leaf); background: #fff8de; }
.tracks { display: grid; gap: 10px; }
.track { text-align: left; border: 2px solid var(--line); background: #f6fbf8; border-radius: 14px; padding: 12px 14px; color: var(--ink); }
.track[aria-pressed=true] { border-color: var(--leaf); background: #e3f5ea; }
.track b { font-family: var(--font-display); font-size: 19px; display: block; }
.track span { font-size: 14px; color: var(--muted); }
.small { font-size: 13.5px; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.profiles { display: grid; gap: 8px; }
.profiles button { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: #f6fbf8; border-radius: 12px; padding: 8px 12px; text-align: left; color: var(--ink); }
.profiles button.cur { border-color: var(--leaf); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 800; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

/* accounts */
.acct { display: grid; gap: 8px; background: #f1f7f3; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.linkish { background: none; border: 0; padding: 0; color: var(--sky); font-weight: 700; text-decoration: underline; text-align: left; }
.btn.danger { color: #8f2a20; }
.btn.danger-solid { background: var(--coral); color: #fff; }
.check { font-weight: 700; align-items: flex-start; flex-wrap: nowrap; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.modal input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); }
.savecode { font: 700 clamp(20px, 6vw, 28px)/1.3 var(--font-code); letter-spacing: 2px; text-align: center; padding: 16px; border-radius: 14px; background: #fff8de; border: 2px dashed #e0b737; word-break: break-all; }
.foot { display: flex; gap: 16px; justify-content: center; padding: 0 16px 40px; color: var(--muted); font-weight: 700; font-size: 14px; }
.foot a { color: var(--leaf-deep); }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .hero .pip-big { display: none; }
  .xpbar { width: 70px; }
  .stats { gap: 10px; }
  .story { grid-template-columns: 44px 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<footer class="foot"><span>Python Quest</span><a href="#privacy">Privacy</a></footer>
<script>

pendown\n    def isdown(self): return self.down\n    def goto(self, x, y=None):\n        if y is None:\n            x, y = x\n        self._move(float(x), float(y))\n    setpos = setposition = goto\n    def setx(self, x): self._move(float(x), self.y)\n    def sety(self, y): self._move(self.x, float(y))\n    def home(self):\n        self.goto(0, 0); self.h = 0.0\n    def setheading(self, angle): self.h = float(angle) % 360\n    seth = setheading\n    def heading(self): return self.h\n    def position(self): return (round(self.x, 2), round(self.y, 2))\n    pos = position\n    def xcor(self): return round(self.x, 2)\n    def ycor(self): return round(self.y, 2)\n    def distance(self, x, y=None):\n        if y is None:\n            x, y = x\n        return math.hypot(self.x - float(x), self.y - float(y))\n    def pencolor(self, *c):\n        if not c: return self.pc\n        self.pc = _color(c)\n    def fillcolor(self, *c):\n        if not c: return self.fc\n        self.fc = _color(c)\n    def color(self, *c):\n        if not c: return (self.pc, self.fc)\n        if len(c) == 2:\n            self.pc = _color((c[0],)); self.fc = _color((c[1],))\n        else:\n            self.pc = self.fc = _color(c)\n    def pensize(self, width=None):\n        if width is None: return self.w\n        self.w = float(width)\n    width = pensize\n    def begin_fill(self):\n        self.filling = [[self.x, self.y]]\n        self.fill_at = len(_T['ops'])\n    def end_fill(self):\n        if self.filling and len(self.filling) > 2:\n            _T['ops'].insert(self.fill_at, ['fill', self.filling, self.fc])\n        self.filling = None\n    def circle(self, radius, extent=None, steps=None):\n        radius = float(radius)\n        extent = 360.0 if extent is None else float(extent)\n        if steps is None:\n            steps = 1 + int(min(11 + abs(radius) / 6.0, 59.0) * abs(extent) / 360.0)\n        w = extent / steps\n        w2 = 0.5 * w\n        l = 2.0 * radius * math.sin(math.radians( // ---------- Check helpers ----------
const H = {
  lines(s) { return String(s).replace(/\r/g, '').split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== ''); },
  last(s, n) { return H.lines(s).slice(-n); },
  squash(s) { return String(s).replace(/\s+/g, '').toLowerCase(); },
  count(code, re) { return (H.strip(code).match(re) || []).length; },
  // code with comments removed (so "# use //" doesn't count)
  strip(code) { return String(code).split('\n').map(l => l.replace(/#.*$/, '')).join('\n'); },
  uses(code, re) { return re.test(H.strip(code)); },
  ok() { return { ok: true }; },
  no(msg) { return { ok: false, msg }; },
  same(got, want) {
    for (let i = 0; i < want.length; i++) {
      if ((got[i] || '').trim() !== want[i]) {
        return H.no(`Line ${i + 1} should be <code>${esc(want[i])}</code> but your program printed <code>${esc(got[i] || '(nothing)')}</code>.`);
      }
    }
    return null;
  },
  segs(t) {
    return t.turtle.ops.filter(o => o[0] === 'line').map(o => ({
      x1: o[1], y1: o[2], x2: o[3], y2: o[4], color: String(o[5]).toLowerCase(),
      len: Math.hypot(o[3] - o[1], o[4] - o[2])
    })).filter(s => s.len > 0.5);
  },
  near(a, b, tol = 1.5) { return Math.abs(a - b) <= tol; },
  closed(segs) {
    if (!segs.length) return false;
    const a = segs[0], b = segs[segs.length - 1];
    return H.near(a.x1, b.x2) && H.near(a.y1, b.y2);
  },
  bbox(segs) {
    const xs = segs.flatMap(s => [s.x1, s.x2]), ys = segs.flatMap(s => [s.y1, s.y2]);
    return { w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
  },
  // A regular closed polygon with n sides of length size somewhere in the drawing
  polygon(segs, n, size, color) {
    const pool = segs.filter(s => H.near(s.len, size) && (!color || s.color === color));
    for (let i = 0; i + n <= pool.length; i++) {
      const run = pool.slice(i, i + n);
      if (H.closed(run)) return true;
    }
    return false;
  }
};

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ================= Accounts & cloud progress =================
// Learners can stay on this device only, or create an account (username + password) to save
// their progress online and use any computer. No email or real name is collected.
// Sync: pull, merge (progress only moves forward), push only when something changed:
// about 15 seconds after progress, when the page is hidden, and after signing in.

const Cloud = { accounts: false, user: null, syncing: false, last: 0, error: null, timer: null };

async function api(path, body) {
  const r = await fetch(path, body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' }
    : { credentials: 'same-origin' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'http_' + r.status);
  return d;
}

function errorText(e) {
  switch (e) {
    case 'not_configured': return 'Online saving isn\'t switched on for this website yet.';
    case 'storage_busy': return 'Online saving is busy right now. Your progress is safe on this device and will save later.';
    case 'rate_limited': return 'Too many tries in a short time. Wait a few minutes and try again.';
    case 'bad_username': return 'Usernames are 3 to 24 characters: lowercase letters, numbers and _ only.';
    case 'weak_password': return 'Your password needs at least 8 characters.';
    case 'username_taken': return 'Someone already has that username. Try another one.';
    case 'bad_login': return 'That username and password don\'t match.';
    case 'bad_recovery': return 'That Save Code doesn\'t match this username.';
    case 'need_grownup': return 'Please check with a parent, guardian or teacher first, then tick the box.';
    case 'signed_out': return 'You were signed out. Please sign in again.';
    case 'too_large': return 'Your progress is too big to save online.';
    default: return 'Couldn\'t reach the server. Check your internet connection.';
  }
}

// XP always comes from progress, so merging two devices can never double-count it.
function computeXP(p) {
  let x = 0;
  for (const L of LESSONS) {
    const g = p.progress && p.progress[L.id];
    if (!g) continue;
    if (g.quiz) x += g.quizFirst ? 25 : 10;
    if (g.main) x += L.boss ? 200 : 100;
    if (g.bonus) x += 75;
  }
  return x;
}

function toPayload(p) {
  return {
    version: 1, name: p.name, avatar: p.avatar, track: p.track, unlockAll: !!p.unlockAll, prefsAt: p.prefsAt || 0,
    streak: p.streak || 0, best: p.best || 0, lastDay: p.lastDay || null, badges: p.badges || [], progress: p.progress || {}
  };
}

function mergeLesson(a, b) {
  if (!a) return JSON.parse(JSON.stringify(b));
  if (!b) return a;
  const code = {}, codeAt = {};
  for (const k of ['main', 'bonus']) {
    const lt = (a.codeAt && a.codeAt[k]) || 0, rt = (b.codeAt && b.codeAt[k]) || 0;
    const ac = a.code && a.code[k], bc = b.code && b.code[k];
    const useB = bc !== undefined && (ac === undefined || rt > lt);
    if (useB) code[k] = bc; else if (ac !== undefined) code[k] = ac;
    codeAt[k] = Math.max(lt, rt);
  }
  const fa = a.fails || {}, fb = b.fails || {};
  return {
    quiz: !!(a.quiz || b.quiz), quizFirst: !!(a.quizFirst || b.quizFirst),
    main: !!(a.main || b.main), bonus: !!(a.bonus || b.bonus),
    code, codeAt, fails: { main: Math.max(fa.main || 0, fb.main || 0), bonus: Math.max(fa.bonus || 0, fb.bonus || 0) }
  };
}

function mergeProfile(L, R) {
  if (!R || typeof R !== 'object') return L;
  const out = { ...L };
  if ((R.prefsAt || 0) > (L.prefsAt || 0)) Object.assign(out, { name: R.name || L.name, avatar: R.avatar || L.avatar, track: R.track || L.track, unlockAll: !!R.unlockAll, prefsAt: R.prefsAt });
  const newer = (R.lastDay || '') > (L.lastDay || '') || ((R.lastDay || '') === (L.lastDay || '') && (R.streak || 0) > (L.streak || 0)) ? R : L;
  out.streak = newer.streak || 0; out.lastDay = newer.lastDay || null;
  out.best = Math.max(L.best || 0, R.best || 0);
  out.badges = [...new Set([...(L.badges || []), ...(R.badges || [])])];
  out.progress = {};
  for (const k of new Set([...Object.keys(L.progress || {}), ...Object.keys(R.progress || {})])) out.progress[k] = mergeLesson((L.progress || {})[k], (R.progress || {})[k]);
  out.xp = computeXP(out);
  return out;
}

const canon = (x) => JSON.stringify(x, (_k, v) => (v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((o, key) => { o[key] = v[key]; return o; }, {}) : v));

function canSync() { return !!(Cloud.user && hasProfile() && me().account === Cloud.user.username); }

function scheduleSync() {
  if (!canSync()) return;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(() => syncNow(), 15000);
}

async function syncNow(loud = false) {
  if (!canSync() || Cloud.syncing) return false;
  Cloud.syncing = true; renderCloudState();
  const p = me();
  try {
    const remote = await api('/api/progress', { op: 'get' });
    const before = canon(toPayload(p));
    Object.assign(p, mergeProfile(p, remote.data));
    saveLocal();
    const out = toPayload(p);
    if (!remote.data || canon(out) !== canon(remote.data)) await api('/api/progress', { op: 'put', data: out });
    Cloud.last = Date.now(); Cloud.error = null;
    if (canon(out) !== before) { renderTop(); if (!location.hash.startsWith('#m-')) route(); }
    if (loud) toast('☁ Saved online');
    return true;
  } catch (e) {
    Cloud.error = e.message;
    if (e.message === 'signed_out') Cloud.user = null;
    if (loud) toast(errorText(e.message));
    return false;
  } finally {
    Cloud.syncing = false; renderCloudState();
  }
}

// Push this exact state, replacing what is online (used after "Reset my progress").
async function forcePush() {
  if (!canSync()) return;
  try { await api('/api/progress', { op: 'put', data: toPayload(me()) }); Cloud.last = Date.now(); } catch (e) { Cloud.error = e.message; }
}

async function refreshAuth() {
  try {
    const [who, cfg] = await Promise.all([api('/api/auth/me'), api('/api/auth/config')]);
    Cloud.accounts = !!cfg.accounts;
    Cloud.user = who.user || null;
  } catch (e) {
    Cloud.accounts = false; Cloud.user = null; // static hosting or offline: this-device-only mode
  }
  if (Cloud.user) {
    const linked = Object.values(DB.profiles).find(q => q.account === Cloud.user.username);
    if (!linked) await adoptAccount(Cloud.user, false);
    else syncNow();
  }
  renderTop();
}

// After signing in or signing up: link the right local profile to the account, then sync.
async function adoptAccount(user, preferCurrent) {
  const existing = Object.values(DB.profiles).find(q => q.account === user.username);
  let target = existing;
  if (!target && preferCurrent && hasProfile() && !me().account) target = me();
  if (!target) {
    let remote = null;
    try { remote = (await api('/api/progress', { op: 'get' })).data; } catch (e) {}
    target = blankProfile(remote && remote.name ? remote.name : user.username, (remote && remote.avatar) || AVATARS[0], (remote && remote.track) || 'explorer');
    target.prefsAt = 0;
    DB.profiles[target.id] = target;
  }
  target.account = user.username;
  DB.current = target.id;
  saveLocal();
  await syncNow();
  renderTop(); route();
}

function renderCloudState() {
  const el = document.getElementById('cloud-state');
  if (!el) return;
  el.innerHTML = cloudLine();
}
function cloudLine() {
  if (!canSync()) return '';
  if (Cloud.syncing) return 'Saving online…';
  if (Cloud.error) return esc(errorText(Cloud.error));
  if (!Cloud.last) return 'Saved online';
  const mins = Math.round((Date.now() - Cloud.last) / 60000);
  return 'Saved online ' + (mins < 1 ? 'just now' : mins === 1 ? '1 minute ago' : mins + ' minutes ago');
}

// ---------- Account panel inside the profile window ----------
function accountPanel(close) {
  const p = me();
  if (!Cloud.accounts) return { html: '', mount() {} };
  let html;
  if (canSync()) {
    html = `<div class="acct"><b>☁ Saved online</b> as <code>${esc(Cloud.user.username)}</code><div class="small" id="cloud-state">${cloudLine()}</div>
      <div class="row"><button type="button" class="btn light" data-act="sync">Save now</button><button type="button" class="btn light" data-act="password">Change password</button><button type="button" class="btn light" data-act="code">New Save Code</button></div>
      <div class="row"><button type="button" class="btn light" data-act="signout">Sign out</button><button type="button" class="btn light danger" data-act="delete">Delete online account</button></div></div>`;
  } else if (p.account) {
    html = `<div class="acct"><b>This explorer saves online as <code>${esc(p.account)}</code>.</b><div class="small">Sign in to keep saving.</div>
      <div class="row"><button type="button" class="btn primary" data-act="login">Sign in</button></div></div>`;
  } else {
    html = `<div class="acct"><b>Save your progress online</b><div class="small">Then you can carry on from any computer. We only ask for a username and a password. No email, no real name.</div>
      <div class="row"><button type="button" class="btn primary" data-act="signup">Create an account</button><button type="button" class="btn light" data-act="login">I have an account</button></div></div>`;
  }
  return {
    html,
    mount(bg) {
      bg.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
        const act = b.dataset.act;
        if (act === 'sync') { b.disabled = true; await syncNow(true); b.disabled = false; return; }
        if (act === 'signout') {
          b.disabled = true;
          await syncNow();
          try { await api('/api/auth/logout', {}); } catch (e) {}
          const name = me().name;
          delete DB.profiles[me().id];
          Cloud.user = null;
          DB.current = Object.keys(DB.profiles)[0] || null;
          saveLocal(); close(); renderTop(); route();
          toast(`Signed out. ${name}'s progress is saved online.`);
          if (!hasProfile()) welcomeModal();
          return;
        }
        close();
        authModal(act);
      }));
    }
  };
}

// ---------- Sign-up / sign-in / reset / password / delete window ----------
function authModal(mode) {
  const titles = { signup: 'Create your account', login: 'Sign in', reset: 'Use your Save Code', password: 'Change your password', code: 'Get a new Save Code', delete: 'Delete your online account' };
  const body = {
    signup: `<p style="margin:0">Your progress will be saved online so you can keep going on any computer.</p>
      <div><label for="au">Username</label><input type="text" id="au" maxlength="24" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="for example: codefox_7">
        <div class="small">3 to 24 characters: lowercase letters, numbers and _. <b>Don't use your real name.</b></div></div>
      <div><label for="ap">Password</label><input type="password" id="ap" autocomplete="new-password">
        <div class="small">At least 8 characters. Tip: three random words, like <code>purple-taco-river</code>.</div></div>
      <label class="row check"><input type="checkbox" id="ag"> A parent, guardian or teacher said I can make an account.</label>
      <p class="small" style="margin:0">We store your username, a scrambled copy of your password, and your Python Quest progress. Nothing else. <a href="#privacy" data-close>Read the privacy page</a>.</p>`,
    login: `<div><label for="au">Username</label><input type="text" id="au" maxlength="24" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      <div><label for="ap">Password</label><input type="password" id="ap" autocomplete="current-password"></div>
      <button type="button" class="linkish" data-mode="reset">Forgot your password? Use your Save Code</button>`,
    reset: `<p style="margin:0">Your Save Code is the code you wrote down when you made your account. It looks like <code>ABCD-EFGH-JKLM-NPQR</code>.</p>
      <div><label for="au">Username</label><input type="text" id="au" maxlength="24" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      <div><label for="ac">Save Code</label><input type="text" id="ac" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
      <div><label for="ap">New password</label><input type="password" id="ap" autocomplete="new-password"></div>`,
    password: `<div><label for="ao">Current password</label><input type="password" id="ao" autocomplete="current-password"></div>
      <div><label for="ap">New password</label><input type="password" id="ap" autocomplete="new-password"></div>
      <p class="small" style="margin:0">Other computers will be signed out.</p>`,
    code: `<p style="margin:0">You'll get a new Save Code. Your old one will stop working.</p>`,
    delete: `<p style="margin:0">This deletes your account and everything saved online. It can't be undone. Your progress on this computer stays.</p>
      <div><label for="ad">Type your username to confirm</label><input type="text" id="ad" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`
  }[mode];
  const btn = { signup: 'Create my account', login: 'Sign in', reset: 'Set new password', password: 'Change password', code: 'Get a new Save Code', delete: 'Delete forever' }[mode];
  modal(`<h2>${titles[mode]}</h2>${body}
    <div class="verdict bad" id="aerr" hidden></div>
    <div class="row"><button type="button" class="btn ${mode === 'delete' ? 'danger-solid' : 'primary'}" id="ago">${btn}</button><button type="button" class="btn light" id="acancel">Cancel</button>
    ${mode === 'login' ? '<span class="grow"></span><button type="button" class="linkish" data-mode="signup">New here? Create an account</button>' : ''}</div>`, (bg, close) => {
    const val = (id) => { const el = bg.querySelector('#' + id); return el ? el.value : ''; };
    const err = bg.querySelector('#aerr');
    bg.querySelector('#acancel').addEventListener('click', () => { close(); if (!hasProfile()) welcomeModal(); });
    bg.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { close(); authModal(b.dataset.mode); }));
    bg.querySelectorAll('[data-close]').forEach(a => a.addEventListener('click', () => close()));
    bg.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') bg.querySelector('#ago').click(); }));
    bg.querySelector('#ago').addEventListener('click', async (e) => {
      const go = e.currentTarget; go.disabled = true; err.hidden = true;
      try {
        if (mode === 'signup') {
          const d = await api('/api/auth/signup', { username: val('au').trim().toLowerCase(), password: val('ap'), grownupOk: bg.querySelector('#ag').checked });
          Cloud.user = d.user;
          close();
          if (!hasProfile()) { const prof = blankProfile(d.user.username, AVATARS[0], 'explorer'); DB.profiles[prof.id] = prof; DB.current = prof.id; }
          await adoptAccount(d.user, true);
          saveCodeModal(d.recoveryCode, true);
        } else if (mode === 'login') {
          const d = await api('/api/auth/login', { username: val('au').trim().toLowerCase(), password: val('ap') });
          Cloud.user = d.user; close();
          await adoptAccount(d.user, true);
          toast(`Welcome back, ${me().name}!`);
        } else if (mode === 'reset') {
          const d = await api('/api/auth/reset', { username: val('au').trim().toLowerCase(), recoveryCode: val('ac'), password: val('ap') });
          Cloud.user = d.user; close();
          await adoptAccount(d.user, true);
          saveCodeModal(d.recoveryCode, false);
        } else if (mode === 'password') {
          const d = await api('/api/auth/account', { op: 'password', current: val('ao'), password: val('ap') });
          Cloud.user = d.user; close(); toast('Password changed.');
        } else if (mode === 'code') {
          const d = await api('/api/auth/account', { op: 'recovery' });
          close(); saveCodeModal(d.recoveryCode, false);
        } else if (mode === 'delete') {
          await api('/api/auth/account', { op: 'delete', confirm: val('ad').trim().toLowerCase() });
          const p = me(); p.account = null; Cloud.user = null; saveLocal(); close(); renderTop(); route();
          toast('Your online account is deleted.');
        }
      } catch (ex) {
        err.hidden = false; err.textContent = ex.message === 'bad_request' && mode === 'delete' ? 'That isn\'t your username.' : errorText(ex.message);
        go.disabled = false;
      }
    });
  });
}

function saveCodeModal(code, fresh) {
  modal(`<h2>${fresh ? 'Your account is ready!' : 'Your new Save Code'}</h2>
    <p style="margin:0">This is your <b>Save Code</b>. If you ever forget your password, it's the only way back in, because we don't collect email addresses.</p>
    <div class="savecode" aria-label="Save Code">${esc(code)}</div>
    <p style="margin:0"><b>Write it down</b> and give it to a parent, guardian or teacher to keep somewhere safe. You won't see it again.</p>
    <label class="row check"><input type="checkbox" id="wrote"> I wrote my Save Code down.</label>
    <div class="row"><button type="button" class="btn light" id="copy">Copy code</button><span class="grow"></span><button type="button" class="btn primary" id="done" disabled>Done</button></div>`, (bg, close) => {
    bg.querySelector('#wrote').addEventListener('change', (e) => { bg.querySelector('#done').disabled = !e.target.checked; });
    bg.querySelector('#copy').addEventListener('click', async (e) => {
      try { await navigator.clipboard.writeText(code); e.target.textContent = 'Copied'; } catch (x) { e.target.textContent = 'Copy didn\'t work. Write it down instead.'; }
    });
    bg.querySelector('#done').addEventListener('click', () => { close(); if (fresh) toast('☁ Your progress now saves online.'); });
  }, true);
}

// ================= Python engine (Pyodide in a Web Worker) =================
// Pyodide is self-hosted (vendor/pyodide, copied to dist/pyodide by build.py) so the site
// never runs code served by a third-party CDN. Absolute URL because the worker runs from a blob: URL.
const PYODIDE_BASE = new URL('/pyodide/0.26.4/', location.href).href;
const WORKER_SRC = `
let run = null, py = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'init') {
    try {
      importScripts(m.base + 'pyodide.js');
      py = await loadPyodide({ indexURL: m.base });
      py.runPython(m.engine);
      run = py.globals.get('pq_run');
      postMessage({ type: 'ready' });
    } catch (err) { postMessage({ type: 'fatal', error: String(err) }); }
    return;
  }
  if (m.type === 'run') {
    let res;
    try {
      const inputs = py.toPy(m.inputs);
      res = JSON.parse(run(m.code, inputs, m.seed));
      inputs.destroy();
    } catch (err) {
      res = { out: '', err: { type: 'InternalError', msg: String(err), line: null }, need: null, turtle: { used: false, ops: [], turtles: [] } };
    }
    postMessage({ type: 'result', id: m.id, res });
  }
};`;

const Engine = {
  status: 'loading', worker: null, ready: null, pending: new Map(), nextId: 1, queue: Promise.resolve(), listeners: [],
  setStatus(s) { this.status = s; this.listeners.forEach(f => f(s)); },
  boot() {
    this.setStatus('loading');
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    const w = new Worker(url);
    this.worker = w;
    this.ready = new Promise((resolve, reject) => {
      w.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'ready') { this.setStatus('ready'); resolve(); }
        else if (m.type === 'fatal') { this.setStatus('error'); reject(new Error(m.error)); }
        else if (m.type === 'result') { const f = this.pending.get(m.id); if (f) { this.pending.delete(m.id); f(m.res); } }
      };
      w.onerror = (e) => { this.setStatus('error'); reject(new Error(e.message || 'worker failed')); };
    });
    this.ready.catch(() => {});
    w.postMessage({ type: 'init', base: PYODIDE_BASE, engine: ENGINE_PY });
  },
  run(code, inputs = [], seed = 1) {
    const job = this.queue.then(() => this._run(code, inputs, seed));
    this.queue = job.catch(() => {});
    return job;
  },
  async _run(code, inputs, seed) {
    try { await this.ready; } catch (e) {
      return { engineDown: true, out: '', err: null, need: null, turtle: { used: false, ops: [] } };
    }
    return new Promise((resolve) => {
      const id = this.nextId++;
      const timer = setTimeout(() => {
        this.pending.delete(id);
        this.worker.terminate();
        this.boot();
        resolve({ timeout: true, out: '', err: null, need: null, turtle: { used: false, ops: [] } });
      }, 6000);
      this.pending.set(id, (r) => { clearTimeout(timer); resolve(r); });
      this.worker.postMessage({ type: 'run', id, code, inputs: inputs.map(String), seed });
    });
  }
};

// ================= Storage & progress =================
const KEY = 'pyquest.v1';
const AVATARS = ['🐍', '🦊', '🐢', '🐼', '🦉', '🐙', '🦖', '🐱'];
const LEVELS = [[0, 'Hatchling'], [200, 'Wiggler'], [500, 'Explorer'], [900, 'Coder'], [1400, 'Builder'], [2000, 'Hacker'], [2700, 'Wizard'], [3500, 'Legend']];
let DB = loadDB();
Object.values(DB.profiles).forEach(q => { try { q.xp = computeXP(q); } catch (e) {} });
const GUEST = blankProfile('Guest', '🐍', 'explorer');

function loadDB() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.profiles) return j; } catch (e) {}
  return { profiles: {}, current: null };
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
function save() { saveLocal(); scheduleSync(); }
function blankProfile(name, avatar, track) {
  return { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, avatar, track, xp: 0, streak: 0, best: 0, lastDay: null, progress: {}, badges: [], unlockAll: false, prefsAt: Date.now(), account: null };
}
function me() { return DB.profiles[DB.current] || GUEST; }
function hasProfile() { return !!DB.profiles[DB.current]; }
function prog(id) {
  const p = me();
  if (!p.progress[id]) p.progress[id] = { quiz: false, quizFirst: false, main: false, bonus: false, code: {}, codeAt: {}, fails: { main: 0, bonus: 0 } };
  return p.progress[id];
}
function mastered(L) {
  const p = prog(L.id);
  const base = p.quiz && p.main;
  return me().track === 'challenger' ? base && p.bonus : base;
}
function unlocked(i) { return me().unlockAll || i === 0 || mastered(LESSONS[i - 1]); }
function levelOf(xp) {
  let i = 0; while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
  const [lo, name] = LEVELS[i]; const hi = LEVELS[i + 1] ? LEVELS[i + 1][0] : lo + 1000;
  return { n: i + 1, name, pct: Math.min(100, ((xp - lo) / (hi - lo)) * 100), toNext: hi - xp };
}
function dayStr(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function liveStreak() {
  const p = me(); const y = new Date(); y.setDate(y.getDate() - 1);
  return p.lastDay === dayStr() || p.lastDay === dayStr(y) ? p.streak : 0;
}
function touchStreak() {
  const p = me(); const today = dayStr(); const y = new Date(); y.setDate(y.getDate() - 1);
  if (p.lastDay === today) return;
  p.streak = p.lastDay === dayStr(y) ? p.streak + 1 : 1;
  p.best = Math.max(p.best || 0, p.streak);
  p.lastDay = today;
}

const BADGES = [
  { id: 'first', ico: '👋', name: 'First Words', desc: 'Finish Say Hello', test: () => prog('hello').main },
  { id: 'bug', ico: '🐞', name: 'Bug Squasher', desc: 'Finish Bug Hunt', test: () => prog('bugs').main },
  { id: 'art', ico: '🎨', name: 'Turtle Artist', desc: 'Draw your first square', test: () => prog('turtle').main },
  { id: 'w1', ico: '🚀', name: 'Launch Pad Hero', desc: 'Finish every World 1 mission', test: () => worldDone(1) },
  { id: 'w2', ico: '🔐', name: 'Vault Keeper', desc: 'Finish every World 2 mission', test: () => worldDone(2) },
  { id: 'w3', ico: '🐉', name: 'Dungeon Master', desc: 'Beat the Rock Paper Scissors boss', test: () => prog('rps').main },
  { id: 'quiz', ico: '🧠', name: 'Sharp Mind', desc: '5 quizzes right on the first try', test: () => LESSONS.filter(L => prog(L.id).quizFirst).length >= 5 },
  { id: 'bonus', ico: '⭐', name: 'Bonus Hunter', desc: 'Finish 5 bonus challenges', test: () => LESSONS.filter(L => prog(L.id).bonus).length >= 5 },
  { id: 'streak', ico: '🔥', name: 'On Fire', desc: 'Learn 3 days in a row', test: () => (me().best || 0) >= 3 }
];
function worldDone(w) { return LESSONS.filter(L => L.world === w).every(L => prog(L.id).main); }

function award(xp, why) {
  if (!hasProfile()) return;
  const p = me();
  const before = levelOf(p.xp).n;
  p.xp = computeXP(p);
  touchStreak();
  const fresh = BADGES.filter(b => !p.badges.includes(b.id) && b.test());
  fresh.forEach(b => p.badges.push(b.id));
  save();
  renderTop();
  toast(`+${xp} XP · ${why}`);
  const after = levelOf(p.xp);
  if (after.n > before) setTimeout(() => toast(`Level up! You are now a ${after.name}`), 1600);
  fresh.forEach((b, i) => setTimeout(() => toast(`${b.ico} New badge: ${b.name}`), 1600 * (i + 1 + (after.n > before ? 1 : 0))));
}

// ================= Small UI helpers =================
const $ = (sel, root = document) => root.querySelector(sel);
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
let toastTimer, toastQueue = [];
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = h('<div class="toast" role="status" aria-live="polite"></div>'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti() {
  if (reduceMotion()) return;
  const c = h('<canvas id="confetti"></canvas>'); document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#ffc93c', '#23935a', '#2f6fdc', '#ef5b4c', '#ffffff'];
  const P = Array.from({ length: 120 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .55, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, r: Math.random() * 6 + 4, c: cols[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let f = 0;
  (function step() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.a += 0.2; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (++f < 90) requestAnimationFrame(step); else c.remove();
  })();
}

// ================= Code editor =================
const KW = new Set('False None True and as break class continue def elif else for from if import in is lambda not or pass return while with try except finally raise global yield del assert'.split(' '));
const BI = new Set('print input int float str len range list dict abs min max round sum type bool random randint choice forward backward fd bk left right lt rt penup pendown up down color circle goto begin_fill end_fill pensize fillcolor pencolor speed dot write bgcolor setheading home hideturtle showturtle upper lower replace strip'.split(' '));
function highlight(src) {
  const re = /(#.*$)|([fFrRbB]{0,2}"(?:[^"\\\n]|\\.)*"?|[fFrRbB]{0,2}'(?:[^'\\\n]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/gm;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    if (m[0] === '') { re.lastIndex++; continue; }
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += `<span class="tk-c">${esc(t)}</span>`;
    else if (m[2]) out += `<span class="tk-s">${esc(t)}</span>`;
    else if (m[3]) out += `<span class="tk-n">${t}</span>`;
    else if (t === 'True' || t === 'False' || t === 'None') out += `<span class="tk-t">${t}</span>`;
    else if (KW.has(t)) out += `<span class="tk-k">${t}</span>`;
    else if (BI.has(t)) out += `<span class="tk-b">${t}</span>`;
    else out += esc(t);
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

let edCount = 0;
function Editor(el, initial, onChange) {
  const id = 'ed' + (++edCount);
  el.innerHTML = `<div class="gutter"></div><pre aria-hidden="true"></pre><textarea id="${id}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Python code editor. Press Escape, then Tab, to leave the editor." rows="2"></textarea>`;
  const ta = $('textarea', el), pre = $('pre', el), gut = $('.gutter', el);
  ta.value = initial;
  let escaped = false;
  function paint() {
    pre.innerHTML = highlight(ta.value) + '\n';
    const n = ta.value.split('\n').length;
    gut.innerHTML = Array.from({ length: n }, (_, i) => `<span>${i + 1}</span>`).join('');
    ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px';
  }
  function insert(text) {
    ta.focus();
    if (!document.execCommand || !document.execCommand('insertText', false, text)) {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input'));
    }
  }
  ta.addEventListener('input', () => { paint(); onChange && onChange(ta.value); });
  ta.addEventListener('scroll', () => { pre.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { escaped = true; return; }
    if (e.key === 'Tab' && !escaped && !e.shiftKey) { e.preventDefault(); insert('    '); return; }
    escaped = false;
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      const before = ta.value.slice(0, ta.selectionStart);
      const line = before.slice(before.lastIndexOf('\n') + 1);
      let ind = line.match(/^ */)[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      e.preventDefault(); insert('\n' + ind);
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); el.dispatchEvent(new CustomEvent('run-shortcut', { bubbles: true })); }
  });
  paint();
  requestAnimationFrame(paint);
  return { get: () => ta.value, set(v) { ta.value = v; paint(); onChange && onChange(v); }, ta };
}

// ================= Friendly errors =================
function friendly(err, code) {
  const t = err.type, m = err.msg || '';
  let say;
  if (t === 'SyntaxError') {
    if (/unterminated string|EOL|EOF while scanning/.test(m)) say = 'A string is missing its closing quote. Every <code>"</code> needs a partner.';
    else if (/was never closed/.test(m)) say = 'A bracket was opened but never closed. Count your <code>(</code> and <code>)</code>.';
    else if (/unmatched/.test(m)) say = 'There is a closing bracket with no opening bracket to match it.';
    else if (/expected ':'/.test(m)) say = 'Lines that start with <code>if</code>, <code>elif</code> or <code>else</code> need a colon <code>:</code> at the end.';
    else if (/Did you mean '=='/.test(m) || /cannot assign/.test(m)) say = 'To compare two things use <code>==</code>. A single <code>=</code> puts a value into a variable.';
    else if (/Missing parentheses/.test(m)) say = '<code>print</code> needs round brackets: <code>print("like this")</code>.';
    else if (/forgot a comma/.test(m)) say = 'Looks like a comma is missing between two things.';
    else say = 'Python can\'t understand the grammar of this line. Look for a missing comma, colon, quote or bracket.';
  } else if (t === 'IndentationError' || t === 'TabError') {
    if (/expected an indented block/.test(m)) say = 'After a line ending in <code>:</code>, the next line must be pushed in by 4 spaces.';
    else if (/unexpected indent/.test(m)) say = 'This line starts with spaces it shouldn\'t have. Move it back to the left edge.';
    else say = 'The spaces at the start of your lines don\'t line up. Lines in the same block need the same indent.';
  } else if (t === 'NameError') {
    const n = (m.match(/name '(\w+)'/) || [])[1] || '?';
    const near = { prnt: 'print', pritn: 'print', Print: 'print', imput: 'input', Input: 'input', true: 'True', false: 'False', lenght: 'len', forwad: 'forward' }[n];
    say = `Python doesn't know the word <code>${esc(n)}</code>.` + (near ? ` Did you mean <code>${near}</code>?` : ' Check the spelling. If it is meant to be text, put it in quotes. If it is a variable, make sure you created it first.');
  } else if (t === 'TypeError') {
    if (/concatenate str|can only concatenate|unsupported operand.*'str'|must be str, not/.test(m)) say = 'You are mixing text and a number with <code>+</code>. Use an f-string, a comma in print, or turn the number into text with <code>str()</code>.';
    else if (/not supported between instances of 'str' and 'int'/.test(m)) say = 'You are comparing text with a number. Did you forget <code>int()</code> around <code>input()</code>?';
    else if (/takes|missing|positional argument/.test(m)) say = 'A command got the wrong number of values inside its brackets.';
    else if (/not callable/.test(m)) say = 'You put brackets after something that isn\'t a command. Maybe a variable has the same name as a command?';
    else say = 'Two things that don\'t fit together were used together.';
  } else if (t === 'ValueError') {
    if (/invalid literal for int|could not convert string to float/.test(m)) say = '<code>int()</code> and <code>float()</code> can only turn number-text like <code>"12"</code> into a number. Try typing digits.';
    else say = 'A value was the right kind but not something Python could use.';
  } else if (t === 'ZeroDivisionError') say = 'You divided by zero. Not even Python can do that!';
  else if (t === 'AttributeError') say = 'That method doesn\'t exist for this kind of value. Check the spelling, like <code>.upper()</code>.';
  else if (t === 'IndexError') say = 'You asked for a position that doesn\'t exist. Remember, positions start at 0.';
  else if (t === 'ModuleNotFoundError' || t === 'ImportError') say = 'Python can\'t find that module. In Python Quest you can use <code>turtle</code>, <code>random</code> and <code>math</code>.';
  else if (t === 'RecursionError') say = 'Your program kept calling itself forever.';
  else say = 'Something went wrong while your program was running.';
  const lineTxt = err.line && code ? code.split('\n')[err.line - 1] : null;
  return `<div class="bug"><b>Pip found a bug${err.line ? ' on line ' + err.line : ''}.</b> ${say}` +
    (lineTxt != null && lineTxt.trim() ? `<span class="raw">${err.line} │ ${esc(lineTxt)}</span>` : '') +
    `<span class="raw">${esc(t)}: ${esc(m)}</span></div>`;
}

// ================= Turtle canvas =================
function cssColor(c) { return String(c || 'black').replace(/\s+/g, '').toLowerCase(); }
function drawTurtle(canvas, T) {
  const S = canvas.width, g = canvas.getContext('2d');
  const ops = T.ops || [];
  let m = 200;
  ops.forEach(o => {
    const pts = o[0] === 'line' ? [o[1], o[2], o[3], o[4]] : o[0] === 'fill' ? o[1].flat() : [o[1], o[2]];
    pts.forEach(v => { m = Math.max(m, Math.abs(v) + 20); });
  });
  (T.turtles || []).forEach(t => { m = Math.max(m, Math.abs(t.x) + 20, Math.abs(t.y) + 20); });
  const k = S / (2 * m), px = S / 420;
  const X = x => S / 2 + x * k, Y = y => S / 2 - y * k;
  function base() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = T.bg ? cssColor(T.bg) : '#fffdf6'; g.fillRect(0, 0, S, S);
    g.lineWidth = 1;
    for (let v = -Math.floor(m / 50) * 50; v <= m; v += 50) {
      g.strokeStyle = v === 0 ? 'rgba(21,50,58,.22)' : 'rgba(21,50,58,.07)';
      g.beginPath(); g.moveTo(X(v), 0); g.lineTo(X(v), S); g.moveTo(0, Y(v)); g.lineTo(S, Y(v)); g.stroke();
    }
  }
  function op(o) {
    if (o[0] === 'line') {
      g.strokeStyle = cssColor(o[5]); g.lineWidth = Math.max(1, o[6] * px); g.lineCap = 'round';
      g.beginPath(); g.moveTo(X(o[1]), Y(o[2])); g.lineTo(X(o[3]), Y(o[4])); g.stroke();
    } else if (o[0] === 'fill') {
      g.fillStyle = cssColor(o[2]); g.beginPath();
      o[1].forEach(([x, y], i) => i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)));
      g.closePath(); g.fill();
    } else if (o[0] === 'dot') {
      g.fillStyle = cssColor(o[4]); g.beginPath(); g.arc(X(o[1]), Y(o[2]), Math.max(1, o[3] * px / 2), 0, Math.PI * 2); g.fill();
    } else if (o[0] === 'text') {
      g.fillStyle = cssColor(o[4]); g.font = `700 ${o[6] * px * 1.3}px Nunito, sans-serif`;
      g.textAlign = o[5] === 'center' ? 'center' : o[5] === 'right' ? 'right' : 'left';
      g.fillText(o[3], X(o[1]), Y(o[2]));
    }
  }
  function turtleAt(x, y, hdg) {
    g.save(); g.translate(X(x), Y(y)); g.rotate(-hdg * Math.PI / 180);
    const s = 9 * px;
    g.fillStyle = '#23935a'; g.strokeStyle = '#16683f'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(s * 1.4, 0); g.lineTo(-s, s * 0.9); g.lineTo(-s * 0.5, 0); g.lineTo(-s, -s * 0.9); g.closePath(); g.fill(); g.stroke();
    g.restore();
  }
  let i = 0;
  const per = Math.max(1, Math.ceil(ops.length / 80));
  const total = reduceMotion() ? ops.length : 0;
  i = total;
  (function frame() {
    base();
    for (let j = 0; j < Math.min(i, ops.length); j++) op(ops[j]);
    if (i < ops.length) {
      const lastLine = ops.slice(0, i).reverse().find(o => o[0] === 'line');
      if (lastLine) turtleAt(lastLine[3], lastLine[4], Math.atan2(lastLine[4] - lastLine[2], lastLine[3] - lastLine[1]) * 180 / Math.PI);
      i += per; requestAnimationFrame(frame);
    } else {
      (T.turtles || []).forEach(t => t.visible && turtleAt(t.x, t.y, t.h));
    }
  })();
}

// ================= Runner (editor + output) =================
function Runner(host, { code, onChange, check }) {
  host.innerHTML = `<div class="runner">
    <div class="editor"></div>
    <div class="bar">
      <button class="btn run" type="button">▶ Run</button>
      ${check ? '<button class="btn check" type="button">✓ Check my mission</button>' : ''}
      <span class="grow"></span>
      <button class="btn ghost reset" type="button">Start over</button>
    </div>
    <div class="console" aria-live="polite"></div>
    <div class="canvas-wrap" hidden><canvas width="840" height="840" aria-label="Turtle drawing"></canvas></div>
  </div>`;
  const original = code.original != null ? code.original : code.text;
  const ed = Editor($('.editor', host), code.text, onChange);
  const cons = $('.console', host), runBtn = $('.run', host), wrap = $('.canvas-wrap', host);
  let inputs = [], seed = 1, resetArmed = false;
  async function exec() {
    runBtn.disabled = true;
    cons.innerHTML = `<span class="muted">${Engine.status === 'ready' ? 'Running…' : 'Warming up the Python engine. The first run takes a few seconds…'}</span>`;
    const src = ed.get();
    const r = await Engine.run(src, inputs, seed);
    runBtn.disabled = false;
    show(r, src);
  }
  function show(r, src) {
    cons.innerHTML = '';
    if (r.engineDown) { cons.innerHTML = '<div class="bug"><b>The Python engine couldn\'t start.</b> Check your internet connection, then refresh the page.</div>'; return; }
    if (r.out) cons.appendChild(document.createTextNode(r.out));
    if (r.timeout) cons.insertAdjacentHTML('beforeend', '<div class="bug"><b>Your program ran for more than 6 seconds,</b> so Pip stopped it. Is something repeating forever?</div>');
    if (r.err) cons.insertAdjacentHTML('beforeend', friendly(r.err, src));
    if (r.need !== null && r.need !== undefined) {
      const box = h(`<form class="ask"><label class="sr" for="ask${edCount}">Your answer</label><input id="ask${edCount}" autocomplete="off" placeholder="Type your answer and press Enter"><button class="btn run" type="submit">Send</button></form>`);
      box.addEventListener('submit', (e) => { e.preventDefault(); inputs.push($('input', box).value); exec(); });
      cons.appendChild(box);
      setTimeout(() => $('input', box).focus({ preventScroll: true }), 30);
    }
    if (!r.out && !r.err && !r.timeout && r.need == null && !(r.turtle && r.turtle.used)) cons.innerHTML = '<span class="muted">Your program finished without printing anything.</span>';
    if (r.turtle && r.turtle.used) { wrap.hidden = false; drawTurtle($('canvas', wrap), r.turtle); } else wrap.hidden = true;
  }
  runBtn.addEventListener('click', () => { inputs = []; seed = Math.floor(Math.random() * 1e9); exec(); });
  host.addEventListener('run-shortcut', () => runBtn.click());
  const resetBtn = $('.reset', host);
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) { resetArmed = true; resetBtn.textContent = 'Tap again to reset'; setTimeout(() => { resetArmed = false; resetBtn.textContent = 'Start over'; }, 2500); return; }
    resetArmed = false; resetBtn.textContent = 'Start over'; ed.set(original); cons.innerHTML = ''; wrap.hidden = true;
  });
  if (check) $('.check', host).addEventListener('click', check);
  return { get: ed.get, set: ed.set, checkBtn: $('.check', host) };
}

class CheckFail extends Error {}
function tester(code) {
  return {
    code,
    async run(inputs = [], seed = 1) {
      const r = await Engine.run(code, inputs.map(String), seed);
      if (r.engineDown) throw new CheckFail('The Python engine couldn\'t start. Check your internet connection and refresh.');
      if (r.timeout) throw new CheckFail('Your program ran too long while Pip was testing it.');
      if (r.err) throw new CheckFail(`Pip hit a bug while testing: <b>${esc(r.err.type)}</b>${r.err.line ? ' on line ' + r.err.line : ''}. Press Run to see the details.`);
      if (r.need !== null && r.need !== undefined) throw new CheckFail('Your program asked for more answers than this mission gives it. Check how many times you use <code>input()</code>.');
      return r;
    }
  };
}

      fb.className = 'feedback bad'; fb.textContent = 'Not quite. Have another look and try again.';

  }));

  }

  window.scrollTo(0, 0);
}

// ================= Modals =================
function modal(html, onMount, locked = false) {
  const bg = h(`<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`);
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && hasProfile() && !locked) close(); };
  document.addEventListener('keydown', onKey);
  onMount(bg, close);
  const f = bg.querySelector('input, button'); f && f.focus();
  return close;
}

function welcomeModal(adding = false) {
  let avatar = AVATARS[0], track = 'explorer';
  modal(`
    <div class="row">${PIP('')}</div>
    <h2>${adding ? 'Add another explorer' : 'Welcome to Python Quest!'}</h2>
    <p style="margin:0">I'm Pip. I'll guide you from your very first line of code to building real games. Let's set up your explorer card.</p>
    <div><label for="nick">Pick a nickname</label><input type="text" id="nick" maxlength="20" placeholder="For example: CodeFox"><div class="small">Use a nickname, not your full real name.</div></div>
    <div><label id="avl">Choose a buddy</label><div class="avatars" role="group" aria-labelledby="avl">${AVATARS.map((a, i) => `<button type="button" data-a="${a}" aria-pressed="${i === 0}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div></div>
    <div><label id="trl">Choose your track</label><div class="tracks" role="group" aria-labelledby="trl">
      <button type="button" class="track" data-t="explorer" aria-pressed="true"><b>Explorer</b><span>New to coding. Hints come sooner and bonus challenges are optional. Great for around grade 7.</span></button>
      <button type="button" class="track" data-t="challenger" aria-pressed="false"><b>Challenger</b><span>Ready for more. You must beat each bonus challenge to unlock the next mission. Great for around grade 10.</span></button>
    </div></div>
    <div class="row"><button type="button" class="btn primary" id="go">Start my quest</button>${adding ? '<button type="button" class="btn light" id="cancel">Cancel</button>' : ''}</div>
    <p class="small" style="margin:0">Your progress is saved in this browser. ${Cloud.accounts ? 'You can save it online later.' : ''}</p>
    ${Cloud.accounts && !adding ? '<button type="button" class="linkish" id="have">Already have an account? Sign in</button>' : ''}`, (bg, close) => {
    const hv = $('#have', bg); if (hv) hv.addEventListener('click', () => { close(); authModal('login'); });
    bg.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { avatar = b.dataset.a; bg.querySelectorAll('[data-a]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    bg.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { track = b.dataset.t; bg.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    const c = $('#cancel', bg); if (c) c.addEventListener('click', close);
    $('#go', bg).addEventListener('click', () => {
      const name = $('#nick', bg).value.trim();
      if (!name) { $('#nick', bg).focus(); $('#nick', bg).placeholder = 'Type a nickname first'; return; }
      const prof = blankProfile(name, avatar, track);
      DB.profiles[prof.id] = prof; DB.current = prof.id; save();
      close(); renderTop(); route();
      toast(`Welcome, ${name}! Your quest begins.`);
    });
  });
}

function profileModal() {
  const p = me();
  let resetArmed = false;
  let closer = null;
  const acct = accountPanel(() => closer && closer());
  closer = modal(`
    <h2>${p.avatar} ${esc(p.name)}</h2>
    <p style="margin:0">Level ${levelOf(p.xp).n} ${levelOf(p.xp).name} · ${p.xp} XP · best streak ${p.best || 0} day(s)</p>
    <div><label id="trl2">Track</label><div class="tracks" role="group" aria-labelledby="trl2">
      <button type="button" class="track" data-t="explorer" aria-pressed="${p.track === 'explorer'}"><b>Explorer</b><span>Bonus challenges optional. Around grade 7.</span></button>
      <button type="button" class="track" data-t="challenger" aria-pressed="${p.track === 'challenger'}"><b>Challenger</b><span>Bonus needed to unlock the next mission. Around grade 10.</span></button>
    </div></div>
    ${acct.html}
    <label class="row" style="font-weight:700"><input type="checkbox" id="ua" ${p.unlockAll ? 'checked' : ''}> Unlock all missions (for teachers and parents)</label>
    <div><label>Switch explorer</label><div class="profiles">${Object.values(DB.profiles).map(q => `<button type="button" data-p="${q.id}" class="${q.id === p.id ? 'cur' : ''}"><span style="font-size:22px">${q.avatar}</span><span><b>${esc(q.name)}</b><br><span class="small">${q.xp} XP · ${q.track}</span></span></button>`).join('')}</div></div>
    <div class="row"><button type="button" class="btn light" id="add">Add another explorer</button><button type="button" class="btn light" id="reset">Reset my progress</button><span class="grow"></span><button type="button" class="btn primary" id="close">Done</button></div>`, (bg, close) => {
    bg.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { p.track = b.dataset.t; p.prefsAt = Date.now(); save(); bg.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    $('#ua', bg).addEventListener('change', (e) => { p.unlockAll = e.target.checked; p.prefsAt = Date.now(); save(); });
    acct.mount(bg, close);
    bg.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => { DB.current = b.dataset.p; save(); close(); renderTop(); route(); }));
    $('#add', bg).addEventListener('click', () => { close(); welcomeModal(true); });
    $('#reset', bg).addEventListener('click', (e) => {
      if (!resetArmed) { resetArmed = true; e.target.textContent = 'Tap again: erase everything?'; return; }
      Object.assign(p, { xp: 0, streak: 0, best: 0, lastDay: null, progress: {}, badges: [] }); saveLocal(); forcePush(); close(); renderTop(); route();
    });
    $('#close', bg).addEventListener('click', () => { close(); renderTop(); route(); });
  });
}

// ================= Router & boot =================
function route() {
  const hsh = location.hash.slice(1);
  if (hsh === 'privacy') return renderPrivacy();
  if (hsh.startsWith('m-')) {
    const L = LESSONS.find(x => 'm-' + x.id === hsh);
    if (L) return renderLesson(L);
  }
  renderMap();
}
window.addEventListener('hashchange', route);
Engine.boot();
renderTop();
route();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') syncNow(); });
refreshAuth().then(() => { if (!hasProfile() && !document.querySelector('.modal-bg')) welcomeModal(); });

</script>
</body>
</html>
